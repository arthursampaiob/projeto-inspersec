[project]
name = "http-headers-scanner"
version = "0.1.0"
description = "Verificador de cabeçalhos HTTP de segurança e gerador de notas A-F"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "respx>=0.21.0",
    "mypy>=1.8.0",
    "ruff",
    "pylint",
]

[project.scripts]
headers = "http_headers_scanner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"